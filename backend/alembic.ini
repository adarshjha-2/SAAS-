# Developer entrypoint for the Alembic CLI (run from backend/):
#   uv run alembic revision --autogenerate -m "add hardware samples"
#   uv run alembic upgrade head
# The database URL comes from the application settings (NEXUS_DATABASE_PATH).
# At runtime the server migrates programmatically; this file is not needed.
[alembic]
script_location = nexus_hash/db/migrations
prepend_sys_path = .
